[project]
name = "Aureum"
version = "0.1.0"
description = "Aureum — event-driven quant research & trading platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "websockets>=12.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-binance>=1.0.19",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "aiosqlite>=0.20",
]
research = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "infra*", "config*", "services*", "research*"]